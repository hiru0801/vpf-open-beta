          +"""Carry a verified VPF update from an authorized reader to the Pages workflow."""
          +
          +import argparse
          +from datetime import datetime, timedelta, timezone
          +from hashlib import sha256
          +import json
          +from pathlib import Path
          +import shutil
          +import subprocess
          +import sys
          +from tempfile import TemporaryDirectory
          +
          +from release_inputs import APP
          +
          +
          +def digest(data):
          +    return sha256(json.dumps(data,ensure_ascii=False,sort_keys=True,
          +                            separators=(',',':')).encode()).hexdigest()
          +
          +
          +def read(path):
          +    return json.loads(path.read_text(encoding='utf-8'))
          +
          +
          +def unpack(packet, base, prior, target, now):
          +    if packet.get('schema')!=1 or packet.get('season')!=base['season']:
          +        raise ValueError('Sai mùa hoặc phiên bản dữ liệu chuyển giao.')
          +    health=packet['health']
          +    if health['status']!='ok' or health.get('error') or not health.get('lastHighlightCheckAt'):
          +        raise ValueError('Chưa xác minh được lượt đọc VPF và kho video.')
          +    stamp=datetime.fromisoformat(health['lastSuccessfulCheckAt'])
          +    video=datetime.fromisoformat(health['lastHighlightCheckAt'])
          +    if not now-timedelta(hours=3)<=video<=stamp<=now+timedelta(minutes=5):
          +        raise ValueError('Mốc đọc VPF hoặc kho video nằm ngoài thời hạn.')
          +    last=prior.get('lastSuccessfulCheckAt')
          +    if last and stamp<=datetime.fromisoformat(last):
          +        return False
          +    if packet['baseDigest']!=digest(base):
          +        raise ValueError('Dữ liệu VPF đã đổi trong lúc đồng bộ. Hãy đọc phiên bản công khai mới và chạy lại.')
