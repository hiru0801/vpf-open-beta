name: VPF Open Beta

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/open-beta.yml
      - vpf-bundle.zip
      - vpf-sync-input.json
  workflow_dispatch:

concurrency:
  group: vpf-open-beta
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      vpf_ok: ${{ steps.sync.outputs.vpf_ok }}
      news_ok: ${{ steps.sync.outputs.news_ok }}
      vpf_error: ${{ steps.sync.outputs.vpf_error }}
      news_hash: ${{ steps.sync.outputs.news_hash }}
      data_hash: ${{ steps.sync.outputs.data_hash }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify and unpack the application
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  vpf-bundle.zip\n' 'e6e7198cde9b4bef3c81112d044b008b73671ff5eaff6000315966c7ac85ca70' | sha256sum -c
          unzip -q vpf-bundle.zip
          git apply <<'VPF_PATCH'
