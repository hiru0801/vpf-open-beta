      - name: Ensure OCR is available
        shell: bash
        run: |
          if ! command -v tesseract >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng
          fi
      - run: python -m pip install --disable-pip-version-check -r requirements.txt fonttools==4.57.0
      - name: Check highlight matching
        run: PYTHONPATH=app/tools python tools/highlights/check.py
      - name: Restore the last verified release
        shell: bash
        run: |
          set -euo pipefail
          checkpoint="$RUNNER_TEMP/vpf-checkpoint"
          git worktree prune --expire now
          if git ls-remote --exit-code --heads origin refs/heads/open-beta-data > /dev/null; then
            git fetch --no-tags origin refs/heads/open-beta-data
            git worktree add --detach "$checkpoint" FETCH_HEAD
          else
            code=$?
            if [[ "$code" != 2 ]]; then exit "$code"; fi
            git worktree add --detach "$checkpoint" HEAD
            git -C "$checkpoint" switch --orphan open-beta-data
          fi
      - name: Sync sources and verify the bundle
        id: sync
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          printf 'artifact_name=github-pages-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          set -euo pipefail
          state="$RUNNER_TEMP/vpf-checkpoint/data"
          output="$RUNNER_TEMP/vpf-web"
          summary="$RUNNER_TEMP/vpf-sync-summary.json"
          export PYTHONPATH="$GITHUB_WORKSPACE/app/tools"
          if [[ -f "$state/updates.json" ]]; then
            if ! timeout 240s python -m live.collect --state "$state"; then
              echo '::warning::Chưa làm mới được dữ liệu ngày thi đấu. Giữ bản đã xác minh.'
            fi
          fi

          if [[ "$EVENT_NAME" == schedule ]] &&
             jq -e '.newsPolicy == "headlines"' "$state/sealed/release-info.json" >/dev/null; then
            if [[ "$EVENT_SCHEDULE" == '3-48/15 * * * *' ]]; then
              python app/tools/sync-pages.py --highlights-only --state "$state" --seed "$GITHUB_WORKSPACE/seed-web" \
                --output "$output" --summary "$summary"
            fi
            test -f "$state/live/index.json" || exit 1
            live_hash=$(sha256sum "$state/live/index.json" | cut -d ' ' -f1)
            public_url="https://hiru0801.github.io/vpf-open-beta/live/index.json"
            if [[ ! -d "$output" ]]; then
              release_id=$(jq -er '.releaseId' "$state/sealed/release-info.json")
              root=${public_url%/live/index.json}
              if curl -fsS --max-time 12 "$public_url?v=$live_hash" -o "$RUNNER_TEMP/public-live.json" &&
                [[ "$(sha256sum "$RUNNER_TEMP/public-live.json" | cut -d ' ' -f1)" == "$live_hash" ]] &&
                curl -fsS --max-time 12 "$root/release-info.json?v=$release_id" |
                  jq -e --arg id "$release_id" '.releaseId == $id' >/dev/null; then
                echo 'deploy=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              python -m live.stage --state "$state" --output "$output"
            fi
          else
            flags=(--force-vpf)
            if [[ "$EVENT_NAME" == workflow_dispatch || ! -f "$state/vpf/highlight-archive-at.txt" ]]; then
              flags+=(--refresh-highlights)
            fi
            if [[ -f vpf-sync-input.json ]]; then flags+=(--delivery "$GITHUB_WORKSPACE/vpf-sync-input.json"); fi
            result=0
            python app/tools/sync-pages.py --state "$state" --seed "$GITHUB_WORKSPACE/seed-web" \
              --output "$output" --summary "$summary" "${flags[@]}" || result=$?
            if [[ "$result" != 0 && "$result" != 2 ]]; then exit "$result"; fi
            printf 'vpf_ok=%s\n' "$(jq -r '.vpf_ok' "$summary")" >> "$GITHUB_OUTPUT"
            printf 'vpf_error=%s\n' "$(jq -r '(.vpf_error // "") | gsub("[\r\n]"; " ")' "$summary")" >> "$GITHUB_OUTPUT"
          fi

          if [[ ! -f "$output/live/index.json" ]]; then
            mkdir -p "$output/live"
            printf '%s\n' '{"schema":1,"season":"2026/27","matches":{}}' > "$output/live/index.json"
          fi
          {
            echo 'deploy=true'
            printf 'news_hash=%s\n' "$(sha256sum "$output/news-feed.json" | cut -d ' ' -f1)"
            printf 'data_hash=%s\n' "$(sha256sum "$output/data-status.json" | cut -d ' ' -f1)"
            printf 'live_hash=%s\n' "$(sha256sum "$output/live/index.json" | cut -d ' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - name: Save verified state
        shell: bash
        working-directory: ${{ runner.temp }}/vpf-checkpoint
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data
          if ! git diff --cached --quiet; then git commit -m 'Update VPF data'; fi
          git -C "$GITHUB_WORKSPACE" push origin "$(git rev-parse HEAD):refs/heads/open-beta-data"
      - name: Stage the public website
        if: steps.sync.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.sync.outputs.artifact_name }}
          path: ${{ runner.temp }}/vpf-web

  publish:
    needs: sync
    if: needs.sync.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: release
        with:
          artifact_name: ${{ needs.sync.outputs.artifact_name }}
      - name: Check the public data
        shell: bash
        env:
          SITE_URL: ${{ steps.release.outputs.page_url }}
          NEWS_HASH: ${{ needs.sync.outputs.news_hash }}
          DATA_HASH: ${{ needs.sync.outputs.data_hash }}
          LIVE_HASH: ${{ needs.sync.outputs.live_hash }}
        run: |
          set -euo pipefail
          root="${SITE_URL%/}"
          stamp="run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          curl -fsS --retry 3 --max-time 20 "$root/release-info.json?$stamp" | jq -e '.revision >= 16'
          curl -fsS --retry 3 --max-time 20 "$root/calendars/SLN.ics" | awk '/^BEGIN:VCALENDAR/{ok=1} END{exit !ok}'
          curl -fsS --retry 3 --max-time 20 "$root/news-feed.json?$stamp" -o news-feed.json
          curl -fsS --retry 3 --max-time 20 "$root/data-status.json?$stamp" -o data-status.json
          printf '%s  news-feed.json\n%s  data-status.json\n' "$NEWS_HASH" "$DATA_HASH" | sha256sum -c
          curl -fsS --retry 3 --max-time 20 "$root/live/index.json?$stamp" -o match-day.json
          printf '%s  match-day.json\n' "$LIVE_HASH" | sha256sum -c
          jq -e '.schema == 1 and .season == "2026/27" and (.matches | type == "object")' match-day.json
          jq -e '.schema == 1 and (.mode == "sync" or .mode == "snapshot") and (.articles | type == "array")' news-feed.json
          curl -fsSL --retry 3 --max-time 20 "$root/legal.html?$stamp" -o legal.html
          grep -q 'id="dinh-chinh"' legal.html
          jq -e '.schema == 1 and (.mode == "sync" or .mode == "snapshot")' data-status.json

  source-health:
    needs: [sync, publish]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Check the official VPF source
        shell: bash
        env:
          VPF_OK: ${{ needs.sync.outputs.vpf_ok }}
          VPF_ERROR: ${{ needs.sync.outputs.vpf_error }}
        run: |
          if [[ "$VPF_OK" != true ]]; then
            printf '%s\n' "$VPF_ERROR"
            echo '::error::Chưa xác nhận được lịch, kết quả và kho video từ VPF.'
            exit 1
          fi
          echo 'Đã xác minh nguồn VPF trong thời hạn.'
