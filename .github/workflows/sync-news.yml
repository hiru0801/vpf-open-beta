name: VPF News Sync

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify-directory:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify the public news directory policy
        shell: bash
        run: |
          set -eo pipefail
          url='https://hiru0801.github.io/vpf-open-beta/news-feed.json'
          curl -fsSL --retry 2 --max-time 15 "$url?run=$GITHUB_RUN_ID" \
            | jq -e '. == {"schema":1,"mode":"directory","articles":[]}'
