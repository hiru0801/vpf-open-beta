<!doctype html>
<html lang="vi" data-league="vl1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172b49">
  <meta name="description" content="Tra cứu lịch, kết quả, bảng xếp hạng và nhánh đấu của ba giải bóng đá chuyên nghiệp Việt Nam.">
  <title>VPF App 2.4.2 · Bóng đá Việt Nam</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'">
  <script src="releases/1eb9c36dc6d9d798abed2ea4/theme.js"></script>
  <link rel="stylesheet" href="releases/1eb9c36dc6d9d798abed2ea4/styles.css">
  <script src="releases/1eb9c36dc6d9d798abed2ea4/index-data.js" defer></script>
  <script src="releases/1eb9c36dc6d9d798abed2ea4/data-update.js" defer></script>
  <script src="releases/1eb9c36dc6d9d798abed2ea4/calendar.js" defer></script>
  <script src="releases/1eb9c36dc6d9d798abed2ea4/competition-view.js" defer></script>
  <script src="releases/1eb9c36dc6d9d798abed2ea4/match-view.js" defer></script>
  <script src="releases/1eb9c36dc6d9d798abed2ea4/web-data.js" defer></script>
  <script src="releases/1eb9c36dc6d9d798abed2ea4/news-view.js" defer></script>
  <script src="releases/1eb9c36dc6d9d798abed2ea4/app.js" defer></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="releases/1eb9c36dc6d9d798abed2ea4/assets/app-192.png">
  <link rel="apple-touch-icon" href="releases/1eb9c36dc6d9d798abed2ea4/assets/app-180.png">
</head>
<body>
  <a class="skip-link" href="#content">Đến nội dung</a>
  <header class="app-header">
    <div class="wrap header-inner">
      <div class="league-brand">
        <img id="league-logo" width="46" height="46" src="releases/1eb9c36dc6d9d798abed2ea4/assets/vl1.webp" alt="">
        <div><div id="league-name" class="league-name">V.League 1</div><div class="small muted"><span id="league-sponsor">LPBank · </span><span id="league-season">2026/27</span></div></div>
      </div>
      <div class="header-actions">
        <button class="button ghost header-clubs" type="button" data-tab="clubs" aria-label="CLB · Câu lạc bộ"><span class="clubs-label">Câu lạc bộ</span><span class="clubs-short" aria-hidden="true">CLB</span></button>
        <div class="header-end">
          <button class="button league-picker" type="button" data-action="picker" aria-haspopup="dialog">Đổi giải <span aria-hidden="true">⌄</span></button>
          <button class="button theme-toggle" type="button" id="theme-toggle" aria-label="Giao diện tối" aria-pressed="false" title="Chuyển sang giao diện tối">
            <svg class="theme-moon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.1 15.4a8.5 8.5 0 0 1-11.5-11.5A8.5 8.5 0 1 0 20.1 15.4Z"/></svg>
            <svg class="theme-sun" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
          </button>
        </div>
      </div>
    </div>
    <nav class="app-nav" aria-label="Điều hướng chính"><div class="wrap nav-inner" id="nav"></div></nav>
  </header>
  <div class="wrap" id="data-health" hidden><p role="status" class="data-health-message"></p></div>
  <main class="wrap content" id="content" tabindex="-1">
    <noscript><p class="panel">Bật JavaScript để tra cứu lịch và kết quả.</p></noscript>
  </main>
  <footer class="wrap footer">
    <button type="button" class="text-button" data-action="sources">Nguồn dữ liệu</button>
    <span id="snapshot-label"></span>
    <button id="refresh-data" type="button" class="text-button" data-action="refresh" hidden>Kiểm tra cập nhật</button>
  </footer>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-bar">
      <button type="button" class="button ghost dialog-back" data-action="detail-back" hidden>‹ Quay lại</button>
      <button type="button" class="button ghost dialog-close" data-action="close" aria-label="Đóng cửa sổ">✕</button>
    </div>
    <div id="dialog-content"></div>
  </dialog>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
</body>
</html>
